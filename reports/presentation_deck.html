<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #1E3A8A;
            --secondary: #3B82F6;
            --accent: #F59E0B;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text-dark); display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
        .deck-container { width: 100%; max-width: 960px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); overflow: hidden; display: flex; flex-direction: column; min-height: 580px; }
        .slide-header { background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%); color: white; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; }
        .slide-header h2 { font-size: 1.5rem; font-weight: 600; }
        .slide-header .badge { background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; }
        .slide-body { padding: 36px 40px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .slide-title { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
        .slide-subtitle { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        .content-box { background: #F1F5F9; border-left: 5px solid var(--secondary); padding: 20px; border-radius: 6px; font-size: 1.05rem; line-height: 1.7; color: #1E293B; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .grid-card { background: white; border: 1px solid #E2E8F0; padding: 16px; border-radius: 8px; }
        .grid-card h4 { color: var(--primary); margin-bottom: 8px; font-size: 1.05rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background-color: #F8FAFC; color: var(--primary); font-weight: 600; }
        .highlight { background-color: #DCFCE7; font-weight: bold; }
        .footer-nav { background: #F8FAFC; border-top: 1px solid #E2E8F0; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--secondary); }
        .btn:disabled { background: #CBD5E1; cursor: not-allowed; }
        .progress-bar { height: 4px; background: #E2E8F0; width: 100%; }
        .progress-fill { height: 100%; background: var(--secondary); transition: width 0.3s ease; }
    </style>
</head>
<body>

<div class="deck-container">

let currentSlide = 0;

function renderSlide(index) {
    const slide = slides[index];
    document.getElementById("headerTopic").innerText = slide.topic;
    document.getElementById("slideIndicator").innerText = `Slide ${index + 1} of ${slides.length}`;
    
    document.getElementById("slideContent").innerHTML = `
        <h1 class="slide-title">${slide.title}</h1>
        <p class="slide-subtitle">${slide.subtitle}</p>
        ${slide.content}
    `;
    
    document.getElementById("prevBtn").disabled = index === 0;
    document.getElementById("nextBtn").disabled = index === slides.length - 1;
    
    const progress = ((index + 1) / slides.length) * 100;
    document.getElementById("progressFill").style.width = `${progress}%`;
}

function nextSlide() {
    if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
    }
}

function prevSlide() {
    if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
});

renderSlide(0);
</script>
</body>
</html>
